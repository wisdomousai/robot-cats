<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot cats</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f4f1;
        color: #111;
        font: 14px/1.5 'Schibsted Grotesk', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 0.6s ease;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      noscript {
        position: fixed;
        left: 16px;
        bottom: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <noscript>This page needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/showcase/main.ts"></script>
  </body>
</html>
