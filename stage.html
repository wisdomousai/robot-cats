<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1efe9;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #4d4940;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #readout {
        position: fixed;
        top: 10px;
        right: 12px;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 4px;
      }
      #label {
        position: absolute;
        left: 0;
        top: 0;
        margin: -18px 0 0 -18px;
        padding: 1px 6px;
        border: 1px solid #ff5a1f;
        border-radius: 3px;
        color: #ff5a1f;
        background: rgba(255, 255, 255, 0.8);
      }
      #panel {
        position: fixed;
        left: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .row {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .row span {
        width: 56px;
        color: #8a8477;
      }
      button {
        font: inherit;
        padding: 3px 8px;
        border: 1px solid #d6d1c6;
        border-radius: 4px;
        background: #faf9f6;
        color: #4d4940;
        cursor: pointer;
      }
      button.on {
        border-color: #ff5a1f;
        color: #ff5a1f;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"><div id="label">head</div></div>
    <div id="readout">starting</div>
    <div id="panel"></div>
    <script type="module" src="/src/showcase/dev-stage.ts"></script>
  </body>
</html>
